<div>



<div class="alert alert-danger" *ngIf="erro()">{{erro()}}</div>

<div class="row">
        <div class="col">
            <h2>Faça seu login</h2>
            <label class="form-label">E-mail:</label>
            <input type="email" id="txtEmail" name="email" class="form-control" [(ngModel)]="email">
            <label class="form-label">Senha:</label>
            <input type="password" id="txtSenha" name="senha" class="form-control" [(ngModel)]="senha" (keyup.enter)="entrar()">
            <a routerLink="/reenvio" class="text-vinho text-decoration-none small fw-semibold">Esqueci minha senha</a>
            <button class="btn btn-dark w-100 mb-5 mt-4" (click)="entrar()">Entrar</button>
        </div>
        <div class="col" id="cadastro">
            Ainda não tem cadastro?<br>
            <a routerLink="/cadastro" class="btn btn-primary w-100">Se cadastrar</a>
        </div>
    </div>
</div>
