<div class="row">
    <h3 *ngIf="termo()">Resultados para "{{termo()}}"</h3>
    <h3 *ngIf="!termo()">Pesquisa</h3>

    <div class="alert alert-info" *ngIf="!termo()">Digite o nome de um produto na barra de pesquisa.</div>
    <div class="alert alert-warning" *ngIf="termo() && lista().length === 0">
        Nenhum produto encontrado. <a routerLink="/vitrine">Ver toda a vitrine</a>
    </div>
</div>

<div class="row lista-produtos">
    <div class="card col-sm-12 col-md-6"
     *ngFor="let obj of lista()">
        <img src="{{obj.codigo}}.jpeg" id="ImgVitrine" class="center" ><br>
        <div class="car-body">
            <label class="card-title"><strong>{{obj.nome}}</strong></label><br>
            R$ {{obj.valor | number:'1.2-2'}}<br>
            <a routerLink="/detalhe" [queryParams]="{codigo: obj.codigo}">
            <button class="btn btn-dark" id="op" >Ver Produto</button>
            </a>
            <button class="btn btn-dark" id="op" *ngIf="obj.quantidade>0" (click)="comprar(obj)">Adicionar a Cesta</button>
        </div>
    </div>
</div>
