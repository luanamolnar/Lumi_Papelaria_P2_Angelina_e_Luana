<div class="row">
<h3>Cadastro</h3>

<div *ngIf="mensagem()">
    <div class="alert alert-success">{{mensagem()}}</div>
    <a routerLink="/login" class="btn btn-primary w-100">Ir para o login</a>
</div>

<div class="alert alert-danger" *ngIf="erro()">{{erro()}}</div>

<form class="was-validated" #f="ngForm" (ngSubmit)="cadastrar()" *ngIf="!mensagem()">
    <label for="txtNome" class="form-label">Nome:</label>
    <input type="text" class="form-control" id="txtNome" name="nome" [(ngModel)]="cliente.nome" required>
    <div class="invalid-feedback">Obrigatório!</div>

    <label class="form-label" for="txtEmail">E-mail:</label>
    <input type="email" class="form-control" id="txtEmail" name="email" [(ngModel)]="cliente.email" required>
    <div class="invalid-feedback">Obrigatório!</div>

    <label class="form-label">Senha:</label>
    <input type="password" class="form-control" id="txtSenha" name="senha" [(ngModel)]="cliente.senha"
    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" required>
    <div class="invalid-feedback">A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula, um número e um caractere especial.</div>

    <label class="form-label" for="txtTelefone">Telefone:</label>
    <input type="text" class="form-control" id="txtTelefone" name="telefone" [(ngModel)]="cliente.telefone" required>
    <div class="invalid-feedback">Obrigatório!</div>

    <label class="form-label" for="txtCpf">CPF:</label>
    <input type="text" class="form-control" id="txtCpf" name="cpf" [(ngModel)]="cliente.documento"
    pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" maxlength="14" placeholder="000.000.000-00" required>
    <div class="invalid-feedback">Informe um CPF válido.</div>

    <button type="submit" class="btn btn-dark w-100 mt-5" [disabled]="f.invalid">Cadastrar</button>
</form>
</div>
